[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cogllm"
version = "0.1.0"
description = "Run classic psychology experiments on language models and compare them with humans"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "Muzamil" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
human = ["datasets>=2.18"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
cogllm = "cogllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
